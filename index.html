<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxBuT6a0tUL7vfkdPTJjBGkN5jiLuebjBZP1IroWkdoRPYvKPSr-pnATOaqU_ZBG8jT/exec';

async function apiGet(action, params = {}) {
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  for (const k in params) url.searchParams.set(k, params[k]);
  const res = await fetch(url.toString());
  return res.json();
}

async function apiPost(body) {
  const res = await fetch(API_URL, { 
    method: 'POST', 
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body) 
  });
  return res.json();
}

let STATE = { jueces: [], participantes: [], criterios: [], juezActual: null, pin: '', misPuntajes: {}, resultadosTimer: null };

const VIEWS = ['landing', 'jueces', 'organizador', 'publico'];
function router() {
  const hash = (location.hash || '#').slice(1);
  const view = VIEWS.includes(hash) ? hash : 'landing';
  VIEWS.forEach(v => {
    const el = document.getElementById('view-' + v);
    if(v === view) {
      el.classList.remove('hidden');
      el.style.animation = 'none';
      el.offsetHeight;
      el.style.animation = null;
    } else {
      el.classList.add('hidden');
    }
  });
  
  clearInterval(STATE.resultadosTimer);
  if (view === 'jueces') initJueces();
  if (view === 'organizador') { loadOrganizador(); STATE.resultadosTimer = setInterval(loadOrganizador, 5000); }
  if (view === 'publico') { loadPublico(true); STATE.resultadosTimer = setInterval(() => loadPublico(false), 4000); }
}
window.addEventListener('hashchange', router);

async function loadInit() {
  const data = await apiGet('init');
  if (!data.ok) throw new Error(data.error || 'Error de conexión');
  STATE.jueces = data.jueces || [];
  STATE.participantes = (data.participantes || []).sort((a, b) => (a.Orden || a.orden || 0) - (b.Orden || b.orden || 0));
  STATE.criterios = data.criterios || [];
  return data;
}

/* Teclado PIN */
let pinBuffer = '';
function renderPinPad() {
  const pad = document.getElementById('pin-pad');
  pad.innerHTML = '';
  ['1','2','3','4','5','6','7','8','9','⌫','0','✓'].forEach(k => {
    const btn = document.createElement('button');
    btn.textContent = k;
    if (k === '⌫') { btn.className = 'wide'; btn.onclick = () => { pinBuffer = pinBuffer.slice(0, -1); updatePinDisplay(); }; }
    else if (k === '✓') { btn.className = 'wide'; btn.onclick = () => document.getElementById('btn-login').click(); }
    else { btn.onclick = () => { if (pinBuffer.length < 6) pinBuffer += k; updatePinDisplay(); }; }
    pad.appendChild(btn);
  });
}

function updatePinDisplay() {
  document.getElementById('pin-display').textContent = pinBuffer.length ? '•'.repeat(pinBuffer.length) : '••••';
}

async function initJueces() {
  document.getElementById('jueces-login').classList.remove('hidden');
  document.getElementById('jueces-panel').classList.add('hidden');
  document.getElementById('login-error').classList.add('hidden');
  document.getElementById('login-loading').classList.remove('hidden');
  document.getElementById('login-fields').classList.add('hidden');
  pinBuffer = '';
  updatePinDisplay();
  renderPinPad();

  try { await loadInit(); } catch (err) { showLoginError(err.message); return; }
  
  document.getElementById('login-loading').classList.add('hidden');
  document.getElementById('login-fields').classList.remove('hidden');

  const sel = document.getElementById('select-juez');
  sel.innerHTML = STATE.jueces.map(j => `<option value="${j.ID || j.id}">${j.Nombre || j.nombre}</option>`).join('');

  const saved = localStorage.getItem('danza_juez');
  if (saved) {
    const { juezId, pin, nombre } = JSON.parse(saved);
    STATE.juezActual = { id: juezId, nombre };
    STATE.pin = pin;
    await entrarPanelJuez();
  }
}

function showLoginError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg;
  el.classList.remove('hidden');
}

document.getElementById('btn-login').addEventListener('click', async () => {
  const btn = document.getElementById('btn-login');
  const juezId = document.getElementById('select-juez').value;
  btn.disabled = true;
  btn.textContent = 'Verificando...';
  
  try {
    const res = await apiPost({ action: 'login', juezId, pin: pinBuffer });
    btn.disabled = false;
    btn.textContent = 'Ingresar al Panel';
    if (!res.ok) { showLoginError(res.error); return; }
    
    const nombreJuez = res.Nombre || res.nombre || 'Jurado';
    STATE.juezActual = { id: juezId, nombre: nombreJuez };
    STATE.pin = pinBuffer;
    localStorage.setItem('danza_juez', JSON.stringify({ juezId, pin: pinBuffer, nombre: nombreJuez }));
    await entrarPanelJuez();
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'Ingresar al Panel';
    showLoginError("Error de conexión al autenticar.");
  }
});

document.getElementById('btn-logout').addEventListener('click', () => {
  localStorage.removeItem('danza_juez');
  STATE.juezActual = null;
  STATE.pin = '';
  pinBuffer = '';
  document.getElementById('jueces-login').classList.remove('hidden');
  document.getElementById('jueces-panel').classList.add('hidden');
});

async function entrarPanelJuez() {
  document.getElementById('jueces-login').classList.add('hidden');
  document.getElementById('jueces-panel').classList.remove('hidden');
  document.getElementById('juez-nombre').textContent = STATE.juezActual.nombre;
  document.getElementById('participantes-list').innerHTML = `<div class="loading-state"><div class="spinner"></div>Cargando datos...</div>`;
  
  const mp = await apiGet('misPuntajes', { juezId: STATE.juezActual.id });
  STATE.misPuntajes = {};
  (mp.puntajes || []).forEach(p => { 
    const pId = p.ParticipanteID || p.participanteId;
    const cId = p.CriterioID || p.criterioId;
    const punt = p.Puntaje ?? p.puntaje ?? 0;
    STATE.misPuntajes[pId + '|' + cId] = punt; 
  });
  renderParticipantesJuez();
}

function calcularTotalParticipante(participanteId) {
  let total = 0, count = 0;
  STATE.criterios.forEach(c => {
    const cId = c.ID || c.id;
    const key = participanteId + '|' + cId;
    if (key in STATE.misPuntajes) { total += Number(STATE.misPuntajes[key]); count++; }
  });
  return count === STATE.criterios.length ? total : null;
}

function renderParticipantesJuez() {
  const wrap = document.getElementById('participantes-list');
  wrap.innerHTML = '';
  let lastCat = null;
  
  STATE.participantes.forEach(p => {
    const pId = p.ID || p.id;
    const pNombre = p.Nombre || p.nombre;
    const pCat = p.Categoria || p.categoria || 'Sin Categoría';

    if (pCat !== lastCat) {
      lastCat = pCat;
      const lbl = document.createElement('div');
      lbl.className = 'categoria-label';
      lbl.textContent = pCat;
      wrap.appendChild(lbl);
    }
    const total = calcularTotalParticipante(pId);
    const scored = total !== null;
    const row = document.createElement('div');
    row.className = 'participante-row' + (scored ? ' done' : '');
    row.innerHTML = `
      <div>
        <div class="name">${pNombre}</div>
        <div class="status">${scored ? `✓ Puntaje: ${total.toFixed(2)} pts` : 'Pendiente'}</div>
      </div>
      <button>${scored ? 'Editar' : 'Calificar'}</button>`;
    row.querySelector('button').onclick = () => abrirPanelPuntuacion(p);
    wrap.appendChild(row);
  });
}

function abrirPanelPuntuacion(participante) {
  document.getElementById('participantes-list').classList.add('hidden');
  const wrap = document.getElementById('score-panel-wrap');
  const valores = {};
  const pId = participante.ID || participante.id;
  const pNombre = participante.Nombre || participante.nombre;
  
  STATE.criterios.forEach(c => {
    const cId = c.ID || c.id;
    const pesoMax = Number(c.PesoMax || c.pesoMax || 100);
    valores[cId] = STATE.misPuntajes[pId + '|' + cId] ?? Math.round(pesoMax / 2);
  });

  wrap.innerHTML = `
    <div class="score-panel">
      <button class="back-link" id="btn-volver" style="margin-bottom:16px;">&larr; Volver</button>
      <h3 style="margin-bottom: 20px;">${pNombre}</h3>
      ${STATE.criterios.map(c => {
        const cId = c.ID || c.id;
        const cNombre = c.Nombre || c.nombre || c.criterioNombre || c.criterio || 'Criterio';
        const pesoMax = Number(c.PesoMax || c.pesoMax || 100);
        return `
        <div class="criterio-row">
          <label><span>${cNombre}</span><span id="val-${cId}" style="color:var(--accent); font-family:'Space Mono';">${Number(valores[cId]).toFixed(2)} / ${pesoMax}</span></label>
          <div class="row-inputs">
            <input type="range" min="0" max="${pesoMax}" step="0.5" value="${valores[cId]}" id="range-${cId}">
            <input type="text" inputmode="decimal" class="score-input" value="${Number(valores[cId]).toFixed(2)}" id="num-${cId}">
          </div>
        </div>`;
      }).join('')}
      <div class="panel-total" id="panel-total"></div>
      <button class="primary-btn" id="btn-guardar">Guardar Puntuaciones</button>
      <div id="save-status" style="text-align:center; margin-top:10px; font-size:13px; color:var(--text-dim);"></div>
    </div>`;

  function actualizarTotalPanel() {
    let total = 0;
    STATE.criterios.forEach(c => { 
      const cId = c.ID || c.id;
      const rawVal = document.getElementById(`num-${cId}`).value.replace(',', '.');
      total += Number(rawVal) || 0; 
    });
    document.getElementById('panel-total').textContent = `PUNTAJE TOTAL: ${total.toFixed(2)} PTS`;
  }
  actualizarTotalPanel();

  STATE.criterios.forEach(c => {
    const cId = c.ID || c.id;
    const range = document.getElementById(`range-${cId}`);
    const num = document.getElementById(`num-${cId}`);
    const pesoMax = Number(c.PesoMax || c.pesoMax || 100);
    
    range.addEventListener('input', () => {
      const v = Number(range.value);
      num.value = v.toFixed(2);
      document.getElementById(`val-${cId}`).textContent = `${v.toFixed(2)} / ${pesoMax}`;
      actualizarTotalPanel();
    });

    num.addEventListener('input', () => {
      let rawVal = num.value.replace(',', '.');
      let valNum = parseFloat(rawVal);
      if (!isNaN(valNum)) {
        valNum = Math.min(pesoMax, Math.max(0, valNum));
        range.value = valNum;
        document.getElementById(`val-${cId}`).textContent = `${valNum.toFixed(2)} / ${pesoMax}`;
      }
      actualizarTotalPanel();
    });

    num.addEventListener('blur', () => {
      let rawVal = num.value.replace(',', '.');
      let valNum = parseFloat(rawVal) || 0;
      valNum = Math.min(pesoMax, Math.max(0, valNum));
      num.value = valNum.toFixed(2);
      range.value = valNum;
      document.getElementById(`val-${cId}`).textContent = `${valNum.toFixed(2)} / ${pesoMax}`;
      actualizarTotalPanel();
    });
  });

  document.getElementById('btn-volver').onclick = () => {
    wrap.innerHTML = '';
    document.getElementById('participantes-list').classList.remove('hidden');
  };
  
  document.getElementById('btn-guardar').onclick = async () => {
    const btn = document.getElementById('btn-guardar');
    const status = document.getElementById('save-status');
    btn.disabled = true;
    status.textContent = 'Enviando calificaciones...';

    for (const c of STATE.criterios) {
      const cId = c.ID || c.id;
      const rawVal = document.getElementById(`num-${cId}`).value.replace(',', '.');
      const puntaje = Number(rawVal) || 0;
      try {
        await apiPost({ 
          action: 'puntuar', 
          juezId: STATE.juezActual.id, 
          pin: STATE.pin, 
          participanteId: pId, 
          criterioId: cId, 
          puntaje 
        });
        STATE.misPuntajes[pId + '|' + cId] = puntaje;
      } catch(e) {
        status.textContent = 'Error de comunicación.';
        btn.disabled = false;
        return;
      }
    }
    
    status.textContent = '✓ Guardado exitosamente';
    renderParticipantesJuez();
    setTimeout(() => { wrap.innerHTML = ''; document.getElementById('participantes-list').classList.remove('hidden'); }, 800);
  };
}

/* Organizador */
async function loadOrganizador() {
  if (!STATE.criterios.length) await loadInit();
  const data = await apiGet('resultados');
  if (!data.ok) return;

  const listCriterios = data.criterios || STATE.criterios;
  const thead = document.getElementById('org-thead-row');
  thead.innerHTML = `<th>#</th><th>Participante</th><th>Categoría</th>` + 
    listCriterios.map(c => `<th>${c.Nombre || c.nombre || c.criterioNombre || c.criterio || 'Criterio'}</th>`).join('') + 
    `<th>Total</th>`;

  const tbody = document.getElementById('org-tbody');
  tbody.innerHTML = (data.resultados || []).map((r, i) => {
    const pNombre = r.Nombre || r.nombre || 'Sin nombre';
    const pCat = r.Categoria || r.categoria || '—';
    const pTotal = typeof r.total === 'number' ? r.total.toFixed(2) : (r.total || '0.00');

    const celdasDetalle = (r.detalle || []).map(d => {
      const cNom = d.criterioNombre || d.criterio || d.Criterio || d.Nombre || d.nombre || 'Criterio';
      const prom = typeof d.promedio === 'number' ? d.promedio.toFixed(2) : (d.promedio || '0.00');
      return `<td data-label="${cNom}">${prom}</td>`;
    }).join('');

    return `
    <tr>
      <td data-label="#">${i + 1}</td>
      <td data-label="Participante"><strong>${pNombre}</strong></td>
      <td data-label="Categoría">${pCat}</td>
      ${celdasDetalle}
      <td data-label="Total"><strong style="color:var(--accent);">${pTotal}</strong></td>
    </tr>`;
  }).join('');
}

/* Público */
async function loadPublico(isFirstLoad = false) {
  const container = document.getElementById('publico-leaderboard');
  
  if (isFirstLoad && !container.querySelector('.lb-card')) {
    container.innerHTML = `<div class="loading-state"><div class="spinner"></div> Actualizando puntuaciones...</div>`;
  }

  const data = await apiGet('resultados');
  if (!data.ok) return;

  const openCards = new Set();
  document.querySelectorAll('.lb-card.active').forEach(c => openCards.add(c.dataset.id));

  container.innerHTML = (data.resultados || []).map((r, i) => {
    const rId = r.ID || r.id;
    const rNombre = r.Nombre || r.nombre || 'Sin Nombre';
    const rCat = r.Categoria || r.categoria || '';
    const rTotal = typeof r.total === 'number' ? r.total.toFixed(2) : (r.total || '0.00');
    const isOpen = openCards.has(String(rId));

    return `
      <div class="lb-card ${i === 0 ? 'rank-1' : ''} ${isOpen ? 'active' : ''}" data-id="${rId}">
        <div class="lb-header" onclick="toggleDetalleCard(this, '${rId}')">
          <span class="lb-rank">${i + 1}</span>
          <div style="flex:1;">
            <div style="font-weight:700;">${rNombre}</div>
            <div style="font-size:12px; color:var(--text-dim);">${rCat}</div>
          </div>
          <div class="lb-total-btn">
            ${rTotal}
            <span class="chevron">▼</span>
          </div>
        </div>
        <div class="lb-detail" id="detail-${rId}">
          ${r.votos ? buildDetailHtml(r.votos) : '<div class="loading-state" style="padding:15px;"><div class="spinner spinner-sm"></div> Cargando desglose...</div>'}
        </div>
      </div>`;
  }).join('');

  openCards.forEach(id => fetchDetalleParticipante(id));
}

// CORRECCIÓN PRINCIPAL: Mapeo exacto del nombre del criterio utilizando STATE.criterios como respaldo.
function buildDetailHtml(votos) {
  if (!votos || !votos.length) return `<div style="color:var(--text-dim); text-align:center; padding:8px;">Sin notas registradas por jurados aún</div>`;
  
  const juradosMap = {};
  votos.forEach(v => {
    const jName = v.juezNombre || v.JuezNombre || v.Juez || v.juezId || 'Jurado';
    if (!juradosMap[jName]) juradosMap[jName] = [];
    juradosMap[jName].push(v);
  });

  return Object.keys(juradosMap).map(juez => {
    const totalJuez = juradosMap[juez].reduce((a, b) => a + Number(b.puntaje ?? b.Puntaje ?? 0), 0);
    const tagsHtml = juradosMap[juez].map(v => {
      const cId = v.criterioId || v.CriterioID || v.criterioID;
      
      // Buscar el nombre real del criterio en el array STATE.criterios
      let cNom = v.criterioNombre || v.criterio || v.Criterio || v.Nombre || v.nombre;
      
      if (!cNom || cNom === 'Criterio') {
        const critObj = STATE.criterios.find(c => String(c.ID || c.id) === String(cId));
        if (critObj) {
          cNom = critObj.Nombre || critObj.nombre || critObj.criterioNombre;
        }
      }
      
      cNom = cNom || 'Criterio';
      const pVal = Number(v.puntaje ?? v.Puntaje ?? 0).toFixed(2);
      return `<span class="criterio-tag">${cNom}: <span>${pVal}</span></span>`;
    }).join('');

    return `
    <div class="juez-detail-row">
      <div class="juez-name">
        <span>🎙️ ${juez}</span>
        <span style="color:var(--accent); font-family:'Space Mono';">${totalJuez.toFixed(2)} pts</span>
      </div>
      <div class="criterio-tag-list">
        ${tagsHtml}
      </div>
    </div>`;
  }).join('');
}

async function toggleDetalleCard(headerEl, participanteId) {
  const card = headerEl.parentElement;
  card.classList.toggle('active');
  if (card.classList.contains('active')) {
    await fetchDetalleParticipante(participanteId);
  }
}

async function fetchDetalleParticipante(participanteId) {
  const detailEl = document.getElementById(`detail-${participanteId}`);
  if (!detailEl) return;
  
  try {
    const res = await apiGet('detalleParticipante', { participanteId });
    const votos = res.votos || (res.participante && res.participante.votos);
    if (res.ok && votos) {
      detailEl.innerHTML = buildDetailHtml(votos);
    }
  } catch(e) {
    detailEl.innerHTML = `<div style="color:var(--danger); text-align:center;">Error al obtener notas</div>`;
  }
}

router();
</script>
